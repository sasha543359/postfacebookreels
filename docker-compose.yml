# Вариант для локального запуска / проверки: Nginx поднимается тут же, рядом.
#
# НА СЕРВЕРЕ ФАЙЛ ДРУГОЙ. Там Nginx уже стоит и слушает порт 80, а этот
# поднял бы второй и подрался бы с ним за порт. setup.sh перезаписывает
# docker-compose.yml серверным вариантом — только «app» и папка с хоста.
services:
  app:
    build: .
    restart: always
    volumes:
      - videos:/var/www/videos
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - videos:/var/www/videos:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  videos:
