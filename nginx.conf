server {
    listen 80;
    server_name _;

    # По этим ссылкам Facebook забирает видео и обложки.
    location /videos/ {
        alias /var/www/videos/;
        autoindex off;
        sendfile on;
        tcp_nopush on;

        # Типы обязательны. Без них mp4 уезжает как application/octet-stream,
        # и Facebook отказывается его принимать.
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            image/png png;
        }
    }

    # Facebook отказывается забирать файл с сайта, который закрыт через
    # robots.txt, и требует, чтобы туда пускали робота
    # «facebookexternalhit/1.1». Пустой robots.txt (204 — «нет содержимого»)
    # означает «запретов нет» и снимает вопрос целиком.
    #
    # Без этой строки nginx ответил бы 404, что тоже сошло бы за «запретов нет».
    # Но 404 — это ещё и то, что видно, если конфиг не подхватился, а явные
    # 204 ни с чем не путаются.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 204;
    }

    client_max_body_size 100M;
}
